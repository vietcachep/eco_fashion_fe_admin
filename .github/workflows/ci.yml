name: CI

# npm ci → lint → typecheck → build trên push/PR (Done Definition). Spec OpenAPI và
# catalog quyền đã commit nên CI không cần backend.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:4000
